<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод кода с кнопками подсказок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Введите 4-значный код</h2>

        <div class="code-container">
            <!-- 1 цифра -->
            <div class="input-group">
                <input type="text" maxlength="1" class="code-input" autofocus>
                <button class="hint-btn" type="button">?</button>
            </div>

            <!-- 2 цифра -->
            <div class="input-group">
                <input type="text" maxlength="1" class="code-input">
                <button class="hint-btn" type="button">?</button>
            </div>

            <!-- 3 цифра -->
            <div class="input-group">
                <input type="text" maxlength="1" class="code-input">
                <button class="hint-btn" type="button">?</button>
            </div>

            <!-- 4 цифра -->
            <div class="input-group">
                <input type="text" maxlength="1" class="code-input">
                <button class="hint-btn" type="button">?</button>
            </div>
        </div>

        <!-- Контейнер для отображения текста выбранной подсказки -->
        <div id="hint-display" class="hint-display">
            <p class="hint-text">Подсказка 1: Первая цифра — это начало счета.</p>
            <p class="hint-text">Подсказка 2: Вторая цифра идет сразу за первой.</p>
            <p class="hint-text">Подсказка 3: Третья цифра — это трио.</p>
            <p class="hint-text">Подсказка 4: Последняя цифра завершает комбинацию.</p>
        </div>

        <button id="check-btn">Проверить</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
